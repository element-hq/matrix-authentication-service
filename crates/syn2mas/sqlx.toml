# Read by the `sqlx` query macros and by `sqlx-cli`, both of which need the
# `sqlx-toml` feature.

[macros.preferred-crates]
# Keeps the macros on `chrono` if another date/time crate enters the dependency
# graph.
date-time = "chrono"
