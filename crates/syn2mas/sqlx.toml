[common]
# syn2mas renames the MAS tables while it runs, so its queries are checked
# against a separate database, see misc/sqlx_update.sh
database-url-var = "SYN2MAS_DATABASE_URL"

[macros.preferred-crates]
# Stay on chrono even if a dependency enables the `time` feature of sqlx
date-time = "chrono"
