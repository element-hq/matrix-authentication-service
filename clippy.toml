doc-valid-idents = ["OpenID", "OAuth", "UserInfo", "..", "PostgreSQL", "SQLite"]

disallowed-methods = [
    { path = "rand::rng", reason = "do not create rngs on the fly, pass them as parameters" },
    { path = "chrono::Utc::now", reason = "source the current time from the clock instead" },
    # ulid's own constructors/accessors below either create their own RNG or use
    # `SystemTime`. Use `mas_data_model::UlidExt` instead so ULID generation takes an
    # injected RNG and `chrono` timestamps.
    { path = "ulid::Ulid::generate", reason = "use mas_data_model::UlidExt::from_datetime_with_rng instead" },
    { path = "ulid::Ulid::with_source", reason = "use mas_data_model::UlidExt::from_datetime_with_rng instead" },
    { path = "ulid::Ulid::from_datetime", reason = "use mas_data_model::UlidExt::from_datetime_with_rng instead" },
    { path = "ulid::Ulid::from_datetime_with_source", reason = "use mas_data_model::UlidExt::from_datetime_with_rng instead" },
    { path = "ulid::Ulid::datetime", reason = "use mas_data_model::UlidExt::datetime_utc instead" },
    { path = "reqwest::Client::new", reason = "use mas_http::reqwest_client instead" },
    { path = "reqwest::RequestBuilder::send", reason = "use send_traced instead" },
    { path = "axum::Router::route", reason = "use aide::axum::ApiRouter::api_route so the route is listed in the API documentation" },
    { path = "axum::Router::route_service", reason = "services are not listed in the API documentation: list the route by hand in the routes-schema binary of mas-handlers" },
    { path = "axum::Router::nest", reason = "use aide::axum::ApiRouter::nest so the routes are listed in the API documentation" },
    { path = "axum::Router::nest_service", reason = "services are not listed in the API documentation: list the route by hand in the routes-schema binary of mas-handlers" },
    { path = "aide::axum::ApiRouter::route", reason = "use api_route so the route is listed in the API documentation" },
    { path = "aide::axum::ApiRouter::route_service", reason = "services are not listed in the API documentation: list the route by hand in the routes-schema binary of mas-handlers" },
    { path = "aide::axum::ApiRouter::nest_service", reason = "services are not listed in the API documentation: list the route by hand in the routes-schema binary of mas-handlers" },
]

disallowed-types = [
    { path = "std::path::PathBuf", reason = "use camino::Utf8PathBuf instead" },
    { path = "std::path::Path", reason = "use camino::Utf8Path instead" },
    { path = "axum::extract::Query", reason = "use axum_extra::extract::Query instead. The built-in version doesn't deserialise lists."},
    { path = "axum::extract::rejection::QueryRejection", reason = "use axum_extra::extract::QueryRejection instead"}
]
