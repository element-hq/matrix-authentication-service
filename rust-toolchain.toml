[toolchain]
channel = "1.98.0"
profile = "minimal"
# No rustfmt: .rustfmt.toml uses nightly-only options, so formatting runs as `cargo +nightly fmt`.
# No cross-compilation targets: the Dockerfile and build.yaml add the ones they need.
components = ["clippy"]
